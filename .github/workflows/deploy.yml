name: Deploy to InfinityFree

on:
  push:
    branches:
      - main  # Otomatis jalan saat kamu melakukan push ke branch main

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          # Mengabaikan file/folder yang tidak perlu di-upload ke server
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/node_modules/**
            **/writable/cache/**
            **/writable/logs/**
            **/writable/session/**
            **/tests/**
            README.md